# 推送到 main 或開 PR 時測試並編譯。
# 發布 Release（標題與說明取自 .github/release-notes/<tag>.md，第一行為標題）：
#   - 推送到 main 時，若 Info.plist 的版本 v<版本> 還沒有 Release、且有對應說明檔，就在該 commit 建立 tag 並發布
#   - 推送 v* tag，或手動執行並填入 tag
name: 編譯與發布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 要發布的版本 tag（例如 v1.2.0），留空則依 Info.plist 的版本
        required: false

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: 編譯
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 測試
        run: Scripts/test-power.sh
      - name: 編譯
        run: ./build.sh
      - name: 驗證簽章
        run: codesign --verify --deep --strict build/macbookBatteryMonitor.app

  release:
    if: ${{ github.event_name != 'pull_request' }}
    name: 發布
    runs-on: macos-15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: 判斷是否發布
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="v$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
            if [[ ! -f ".github/release-notes/$tag.md" ]]; then
              echo "沒有 .github/release-notes/$tag.md，不發布"
              tag=""
            fi
          fi
          if [[ -n "$tag" ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 已經發布過"
            tag=""
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "ZIP=macbookBatteryMonitor-$tag-macOS-arm64.zip" >> "$GITHUB_ENV"
          echo "要發布的版本：${tag:-無}"
      - name: 測試
        if: ${{ env.TAG != '' }}
        run: Scripts/test-power.sh
      - name: 編譯
        if: ${{ env.TAG != '' }}
        run: |
          ./build.sh
          codesign --verify --deep --strict build/macbookBatteryMonitor.app
      - name: 打包
        if: ${{ env.TAG != '' }}
        run: ditto -c -k --sequesterRsrc --keepParent build/macbookBatteryMonitor.app "$ZIP"
      - name: 建立 Release
        if: ${{ env.TAG != '' }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            title="$(head -n 1 "$notes" | sed 's/^# *//')"
            tail -n +3 "$notes" > release-body.md
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$title" --notes-file release-body.md
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
