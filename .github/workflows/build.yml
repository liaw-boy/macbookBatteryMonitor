# 推送到 main 或開 PR 時測試並編譯；推送 v* tag 時發布 Release
# Release 標題與說明取自 .github/release-notes/<tag>.md（第一行為標題），沒有的話自動產生
name: 編譯與發布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: 編譯
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: 測試
        run: Scripts/test-power.sh
      - name: 編譯
        run: ./build.sh
      - name: 驗證簽章
        run: codesign --verify --deep --strict build/macbookBatteryMonitor.app

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: 發布 ${{ github.ref_name }}
    runs-on: macos-15
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      ZIP: macbookBatteryMonitor-${{ github.ref_name }}-macOS-arm64.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - name: 測試
        run: Scripts/test-power.sh
      - name: 編譯
        run: |
          ./build.sh
          codesign --verify --deep --strict build/macbookBatteryMonitor.app
      - name: 打包
        run: ditto -c -k --sequesterRsrc --keepParent build/macbookBatteryMonitor.app "$ZIP"
      - name: 建立 Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            exit 0
          fi
          notes=".github/release-notes/$TAG.md"
          if [[ -f "$notes" ]]; then
            title="$(head -n 1 "$notes" | sed 's/^# *//')"
            tail -n +3 "$notes" > release-body.md
            gh release create "$TAG" "$ZIP" --title "$title" --notes-file release-body.md
          else
            gh release create "$TAG" "$ZIP" --title "$TAG" --generate-notes
          fi
